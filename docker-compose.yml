services:
  backend:
    build:
      context: ./backend
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI}
      WEBHOOK_URI: ${WEBHOOK_URI}
      VERIFY_TOKEN: ${VERIFY_TOKEN}
      DATABASE_PATH: postgres://postgres:${POSTGRES_PASSWORD}@postgis:5432/wanderwell?sslmode=disable
      SERVER_PORT: ":3000"
      FRONTEND_URL: ${FRONTEND_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_KEY: ${SESSION_KEY}
      TILE_CACHE_URL: http://vinylcache:80
      ADMIN_USER_ID: ${ADMIN_USER_ID}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
        PUBLIC_TILE_SERVER_URL: ${PUBLIC_TILE_SERVER_URL}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgis:
    image: postgis/postgis:18-3.6
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wanderwell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wanderwell"]
      interval: 5s
      timeout: 3s
      retries: 10

  vector-tileserver:
    image: ghcr.io/maplibre/martin:1.4.0
    command: ["--cache-size", "0", "--base-path", "/vector"]
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgis:5432/wanderwell?sslmode=disable
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  vinylcache:
    image: varnish:stable
    ports:
      - "3001:80"
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - vector-tileserver
      - raster-tileserver
    restart: unless-stopped

  # Builds the TileServer GL configuration from the athletes known when this
  # Compose stack starts. Recreate this one-shot service to refresh styles.
  tileserver-style-bundle:
    image: alpine:3.21
    environment:
      RASTER_TILE_TOKEN: ${RASTER_TILE_TOKEN}
    command: >
      sh -c 'apk add --no-cache curl tar &&
             sh /scripts/fetch-style-bundle.sh &&
             chown -R 999:999 /data &&
             chmod -R u+rwX,go+rX /data'
    volumes:
      - ./tileserver-gl/fetch-style-bundle.sh:/scripts/fetch-style-bundle.sh:ro
      - tileserver-data:/data
    depends_on:
      - backend
    restart: "no"

  raster-tileserver:
    image: maptiler/tileserver-gl:v5.5.0
    command: "-p 4545 -c /data/config.json"
    volumes:
      - tileserver-data:/data:ro
    ports:
      - 4545:4545
    depends_on:
      tileserver-style-bundle:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgis-data:
  tileserver-data:
